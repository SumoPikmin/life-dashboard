name: Sync Notion and publish

on:
  schedule:
    - cron: "7 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: life-dashboard
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull Notion and build encrypted site
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SKILLTREE_JSON: ${{ secrets.SKILLTREE_JSON }}
          SKILLTREE_GIST: ${{ secrets.SKILLTREE_GIST }}
        run: python build.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
