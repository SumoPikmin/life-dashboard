<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Life Wiki Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* Tokens the page is written against (same names as the claude.ai Dashboard type). */
  :root {
    color-scheme: light;
    --font-anthropic-sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-anthropic-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --cds-font-size-caption: .8125rem; --cds-font-size-body: .9375rem; --cds-font-size-heading: 1.125rem; --cds-font-size-title: 1.75rem;
    --cds-font-weight-medium: 600;
    --cds-gap-xs: .25rem; --cds-gap-sm: .5rem; --cds-gap-md: .875rem; --cds-gap-lg: 1.25rem; --cds-gap-xl: 2rem;
    --cds-pad-xs: .25rem; --cds-pad-sm: .5rem; --cds-pad-md: .75rem; --cds-pad-lg: 1rem; --cds-pad-xl: 1.5rem;
    --cds-radius: 12px; --cds-dur-slow: .35s; --cds-ease-out: cubic-bezier(.2, .8, .2, 1);
    --color-bg: #f5f4f0; --color-panel: #ffffff; --color-fg: #1d1f23; --color-fg-muted: #676b74; --color-border-line: #e3e1db;
    --color-ok: #2c8452; --color-warn: #a8640f; --color-bad: #c03f36;
    --cds-chart-grid: #ebe9e3; --cds-chart-axis: #a6a59f; --cds-chart-muted: #c8c6bf; --cds-chart-reference: #85847f;
    --cds-surface-popover: #ffffff; --cds-border: #e3e1db; --cds-shadow-popover: 0 8px 28px rgba(20, 20, 20, .12); --cds-text-secondary: #676b74;
    --skel: #ecebe6; --skel-hi: #f6f5f1; --side-bg: #eeede8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --color-bg: #131417; --color-panel: #1b1c20; --color-fg: #ebebea; --color-fg-muted: #9b9da4; --color-border-line: #2b2d32;
      --color-ok: #5cc38a; --color-warn: #e4a64e; --color-bad: #ee7a70;
      --cds-chart-grid: #26282d; --cds-chart-axis: #55585f; --cds-chart-muted: #44474e; --cds-chart-reference: #7a7d84;
      --cds-surface-popover: #23252a; --cds-border: #33353b; --cds-shadow-popover: 0 8px 28px rgba(0, 0, 0, .5); --cds-text-secondary: #9b9da4;
      --skel: #222429; --skel-hi: #2b2d33; --side-bg: #0f1013;
    }
  }
  html, body { margin: 0; }
  body { background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  button { font: inherit; }

  /* App frame: sidebar + views. Below 860px the sidebar becomes a top bar. */
  .app { display: grid; grid-template-columns: 15rem minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
  .side { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--side-bg); border-right: 1px solid var(--color-border-line); display: flex; flex-direction: column; gap: 1.4rem; padding: calc(1rem + env(safe-area-inset-top, 0px)) .85rem 1.25rem max(.85rem, env(safe-area-inset-left, 0px)); }
  /* Brand card: area-colour glow, a ring of the seven areas around today's date. */
  .side-brand { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: .75rem; padding: .85rem .9rem 1rem; border-radius: 16px; color: var(--color-fg); text-decoration: none;
    background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in oklab, #e3923a 32%, transparent), transparent 60%),
      radial-gradient(110% 90% at 100% 0%, color-mix(in oklab, #4a7fd0 28%, transparent), transparent 62%),
      radial-gradient(120% 100% at 100% 100%, color-mix(in oklab, #8a66d1 28%, transparent), transparent 60%),
      radial-gradient(110% 100% at 0% 100%, color-mix(in oklab, #d25d93 26%, transparent), transparent 60%),
      var(--color-panel);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--color-fg) 8%, transparent), 0 8px 22px -14px rgba(0, 0, 0, .35); }
  .side-brand::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: linear-gradient(90deg, #e0614f, #e3923a, #3a9b68, #d25d93, #4a7fd0, #8a66d1, #7f8a9b); }
  .side-brand:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  .side-logo { width: 2.85rem; height: 2.85rem; flex: none; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .12)); }
  .side-logo .ring { transform-box: view-box; transform-origin: 20px 20px; transform: rotate(-96deg); }
  .side-logo .ring circle { fill: none; stroke-width: 4.6; stroke-linecap: round; }
  .side-logo .hub { fill: var(--color-panel); }
  .side-logo text { font-family: var(--font-anthropic-serif); font-size: 14px; font-weight: 500; fill: var(--color-fg); }
  @media (prefers-reduced-motion: no-preference) {
    .side-logo .ring { transition: transform .9s var(--cds-ease-out); }
    .side-brand:hover .side-logo .ring { transform: rotate(-44.57deg); }
  }
  .side-brand-text { display: grid; gap: 2px; min-width: 0; }
  .side-title { font-family: var(--font-anthropic-serif); font-size: 1.4rem; line-height: 1.05; letter-spacing: -.01em; }
  .side-date { font-size: .75rem; color: var(--color-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Nav: each view carries its life-area colour (--c). */
  .side-nav { display: grid; gap: 1.1rem; }
  .side-group { display: grid; gap: .2rem; }
  .side-label { padding: 0 .6rem .15rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--color-fg-muted); }
  .side-link { --c: var(--color-fg-muted); display: flex; align-items: center; gap: .65rem; padding: .35rem .5rem; border-radius: 11px; color: var(--color-fg-muted); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
  .side-ico { width: 1.9rem; height: 1.9rem; flex: none; display: grid; place-items: center; border-radius: 9px; color: var(--c); background: color-mix(in oklab, var(--c) 15%, transparent); transition: background .15s, color .15s, box-shadow .15s; }
  .side-ico svg { width: 1.05rem; height: 1.05rem; }
  .side-link:hover { color: var(--color-fg); background: color-mix(in oklab, var(--c) 9%, transparent); }
  .side-link[aria-current="page"] { color: var(--color-fg); background: color-mix(in oklab, var(--c) 12%, var(--color-panel)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 30%, transparent); }
  .side-link[aria-current="page"] .side-ico { color: #fff; background: var(--c); box-shadow: 0 4px 12px -4px color-mix(in oklab, var(--c) 75%, transparent); }
  .side-link[data-view="home"] { --c: var(--color-fg); }
  .side-link[data-view="home"] .side-ico { background: color-mix(in oklab, var(--color-fg) 8%, transparent); }
  .side-link[data-view="home"][aria-current="page"] .side-ico { background: conic-gradient(from 210deg, #e0614f, #e3923a, #3a9b68, #4a7fd0, #8a66d1, #d25d93, #e0614f); box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .35); }
  .side-badge { margin-left: auto; min-width: 1.3rem; height: 1.25rem; padding: 0 .4rem; display: grid; place-items: center; border-radius: 999px; font-size: .7rem; font-weight: 600; color: #fff; background: var(--c); }
  .side-link:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  .side-foot { margin-top: auto; display: grid; gap: .6rem; padding: 0 .5rem; }
  .side-sync { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; align-items: baseline; gap: .45rem; line-height: 1.35; }
  .side-sync::before { content: ""; flex: none; width: .45rem; height: .45rem; border-radius: 50%; background: var(--color-ok); transform: translateY(-1px); }
  .side-sync.is-stale::before { background: var(--color-warn); }
  .side-btns { display: flex; gap: .4rem; flex-wrap: wrap; }
  .shell-btn { font-size: var(--cds-font-size-caption); cursor: pointer; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 999px; padding: .2rem .75rem; }
  .shell-btn:hover { border-color: var(--color-fg-muted); }
  a.shell-btn { text-decoration: none; display: inline-block; }
  .shell-btn:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  #dash-root { min-width: 0; padding-block: 2rem 3.5rem; padding-left: max(16px, min(3vw, 2.5rem)); padding-right: max(16px, env(safe-area-inset-right, 0px), min(3vw, 2.5rem)); }
  .view { max-width: 1240px; margin: 0 auto; }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: sticky; z-index: 30; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; padding: calc(.5rem + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) .5rem max(16px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--color-border-line); }
    .side-brand { gap: .55rem; padding: .3rem .7rem .4rem .35rem; border-radius: 12px; }
    .side-logo { width: 2rem; height: 2rem; }
    .side-title { font-size: 1.1rem; }
    .side-date { font-size: .6875rem; }
    .side-nav { order: 3; flex-basis: 100%; display: flex; flex-wrap: nowrap; gap: .3rem; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; }
    .side-nav::-webkit-scrollbar { display: none; }
    .side-group { display: contents; }
    .side-label { display: none; }
    .side-link { padding: .25rem .6rem .25rem .3rem; gap: .45rem; white-space: nowrap; flex: none; }
    .side-ico { width: 1.6rem; height: 1.6rem; border-radius: 7px; }
    .side-badge { margin-left: .1rem; }
    .side-foot { margin: 0 0 0 auto; flex: 1 1 auto; display: flex; align-items: center; justify-content: flex-end; gap: .75rem; padding: 0; min-width: 0; }
    .side-sync { min-width: 0; font-size: .75rem; }
    .side-btns { flex-wrap: nowrap; }
    #dash-root { padding-block: 1.25rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }

  .dash-skeleton { color: transparent !important; border-radius: 6px; background: linear-gradient(90deg, var(--skel) 0%, var(--skel-hi) 50%, var(--skel) 100%) 0 0 / 200% 100%; }
  @media (prefers-reduced-motion: no-preference) { .dash-skeleton { animation: shell-shimmer 1.4s linear infinite; } }
  @keyframes shell-shimmer { to { background-position: -200% 0; } }

  .lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 2rem; }
  .lock-card { width: min(100%, 24rem); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 16px; padding: 1.75rem; display: grid; gap: .9rem; box-shadow: var(--cds-shadow-popover); }
  .lock-title { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 1.75rem; line-height: 1.1; }
  .lock-note { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .lock-card input[type="password"] { width: 100%; font: inherit; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 10px; padding: .65rem .8rem; }
  .lock-card input[type="password"]:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
  .lock-row { display: flex; align-items: center; gap: .5rem; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
  .lock-btn { font-weight: 600; cursor: pointer; color: var(--color-bg); background: var(--color-fg); border: 0; border-radius: 10px; padding: .65rem 1rem; }
  .lock-btn:disabled { opacity: .6; cursor: progress; }
  .lock-msg { min-height: 1.2em; margin: 0; font-size: var(--cds-font-size-caption); color: var(--color-bad); }
  .swatches { display: flex; gap: 4px; }
  .swatches span { width: 1.25rem; height: .3rem; border-radius: 999px; }
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lock-form" autocomplete="on">
    <div class="swatches" aria-hidden="true">
      <span style="background:#e0614f"></span><span style="background:#e3923a"></span><span style="background:#3a9b68"></span><span style="background:#d25d93"></span><span style="background:#4a7fd0"></span><span style="background:#8a66d1"></span><span style="background:#7f8a9b"></span>
    </div>
    <h1 class="lock-title">Life Wiki Dashboard</h1>
    <p class="lock-note">Your data is encrypted. Enter the dashboard password to open it.</p>
    <input type="text" name="username" value="life-dashboard" autocomplete="username" hidden>
    <input type="password" id="lock-pw" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <label class="lock-row"><input type="checkbox" id="lock-remember"> Remember on this device</label>
    <button class="lock-btn" id="lock-btn" type="submit">Unlock</button>
    <p class="lock-msg" id="lock-msg" role="status"></p>
  </form>
</div>

<script>
/* Stand-in for the claude.ai Dashboard runtime: the Home view calls dash.data / calc / loader / onData / params. */
window.dash = (() => {
  const data = {}, status = {}, loaders = {}, calcs = [], subs = [];
  let params = { area: null };
  const run = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  let t = null;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(run, 150); });
  return {
    colors: ['#e0614f', '#e3923a', '#3a9b68', '#d25d93', '#4a7fd0', '#8a66d1', '#7f8a9b', '#a8a29e'],
    loader(id, o) { loaders[id] = o; },
    calc(id, o) { calcs.push({ id, ...o }); },
    data(id) {
      const s = status[id] || 'loading';
      return { status: s, data: s === 'ok' ? data[id] : [], refreshing: false, meta: [], message: '' };
    },
    onData(fn) { subs.push(fn); try { fn(); } catch (e) { console.error(e); } },
    params() { return params; },
    setParams(p) { params = { ...params, ...p }; run(); },
    resetParams() { params = { area: null }; run(); },
    redraw: run,
    refresh() {}, setLink() {},
    _load(sources) {
      for (const [id, value] of Object.entries(sources)) {
        try {
          data[id] = loaders[id] ? loaders[id].fn({ answer: value, args: {}, read: {} }) : value;
          status[id] = 'ok';
        } catch (e) { console.error(id, e); status[id] = 'error'; }
      }
      for (const c of calcs) {
        try {
          if (c.inputs.some((i) => status[i] !== 'ok')) throw new Error('input missing');
          data[c.id] = c.fn(...c.inputs.map((i) => data[i]));
          status[c.id] = 'ok';
        } catch (e) { console.error(c.id, e); status[c.id] = 'error'; }
      }
      run();
    },
  };
})();
</script>

<div class="app" id="app" hidden>

          <circle cx="20" cy="20" r="15" stroke="#e3923a" stroke-dasharray="6.6 87.65" stroke-dashoffset="-13.46"/>
          <circle cx="20" cy="20" r="15" stroke="#3a9b68" stroke-dasharray="6.6 87.65" stroke-dashoffset="-26.93"/>

      <div class="side-btns">
        <a class="shell-btn" id="shell-sync-now" href="https://github.com/SumoPikmin/life-dashboard/actions/workflows/sync.yml" target="_blank" rel="noopener" title="Opens GitHub: click Run workflow to sync from Notion now">Sync now ↗</a>
        <button type="button" class="shell-btn" id="shell-lock">Lock</button>
      </div>
    </div>
  </aside>
  <script>
  /* Brand card date + Social overdue badge. */
  (() => {
    const d = new Date();
    const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    u.setUTCDate(u.getUTCDate() + 4 - (u.getUTCDay() || 7));
    const week = Math.ceil(((u - Date.UTC(u.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
    document.getElementById('side-day').textContent = d.getDate();
    document.getElementById('side-date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long' }) +' \u00b7 week ' + week;
    dash.onData(() => {
      const b = document.getElementById('side-badge-social');
      let n = 0;
      try { n = window.lifeCRM ? window.lifeCRM().filter((p) => p.state === 'over').length : 0; } catch (_) {}
      b.textContent = n; b.hidden = !n; b.title = n + ' overdue to contact';
    });
  })();
  </script>

  <main id="dash-root">
  <section class="view" id="view-home" data-view="home">
