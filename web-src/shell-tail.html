  </section>
  </main>
</div>

<script>
/* Unlock data.enc (AES-GCM, PBKDF2-SHA256), route between views, and re-check for a newer sync every 10 minutes. */
(() => {
  const $ = (s) => document.querySelector(s);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u8) => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return btoa(s); };
  const keySlot = (blob) => 'life-key:' + blob.salt;
  const USES = ['encrypt', 'decrypt'];
  let key = null, lastGen = null, booted = false;

  async function fetchBlob() {
    const res = await fetch('data.enc?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('Could not load data.enc (HTTP ' + res.status + ')');
    return res.json();
  }
  async function deriveKey(password, blob) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iter },
      base, { name: 'AES-GCM', length: 256 }, true, USES);
  }
  async function decrypt(blob, k) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, k, b64(blob.ct));
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(text);
  }
  async function remembered(blob) {
    try {
      const raw = localStorage.getItem(keySlot(blob));
      return raw ? await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', true, USES) : null;
    } catch (_) { return null; }
  }
  function forget() {
    try { Object.keys(localStorage).filter((k) => k.startsWith('life-key:')).forEach((k) => localStorage.removeItem(k)); } catch (_) {}
  }

  /* Seals small secrets (the GitHub token) with the dashboard key, so they only open after the password. */
  window.lifeVault = {
    async seal(text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
      const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
      return toB64(out);
    },
    async open(sealed) {
      const raw = b64(sealed);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
      return new TextDecoder().decode(plain);
    },
  };

  function ago(iso) {
    const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 48 ? h + (h === 1 ? ' hour ago' : ' hours ago') : Math.round(h / 24) + ' days ago';
  }
  function updateSync() {
    if (!lastGen) return;
    const el = $('#shell-sync');
    el.textContent = 'Notion synced ' + ago(lastGen) + ' · every 3 h';
    el.classList.toggle('is-stale', (Date.now() - new Date(lastGen)) / 36e5 > 8);
  }

  // ---------- views
  function route() {
    const want = (location.hash || '#home').slice(1);
    const view = ['skills', 'finance', 'travel', 'health'].includes(want) ? want : 'home';
    document.querySelectorAll('.view').forEach((v) => { v.hidden = v.dataset.view !== view; });
    document.querySelectorAll('.side-link').forEach((a) => {
      if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = { skills: 'Skill tree', finance: 'Finance', travel: 'Travel', health: 'Health & fitness' }[view] || 'Life Wiki Dashboard';
    if (!booted) return;
    if (view === 'skills') window.SkillTree.shown(); else window.dash.redraw();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  async function show(payload, first) {
    lastGen = payload.generated_at;
    $('#lock').hidden = true;
    $('#app').hidden = false;
    booted = true;
    route();
    window.dash._load(payload.sources);
    if (first) await window.SkillTree.init(payload);
    updateSync();
  }
  async function refresh(manual) {
    if (!key) return;
    const btn = $('#shell-refresh');
    if (manual) { btn.disabled = true; btn.textContent = 'Checking…'; }
    try {
      const payload = await decrypt(await fetchBlob(), key);
      const newer = payload.generated_at !== lastGen;
      if (newer) { lastGen = payload.generated_at; window.dash._load(payload.sources); updateSync(); }
      if ((location.hash || '').slice(1) === 'skills') window.SkillTree.shown();
      if (manual) btn.textContent = newer ? 'Updated' : 'Up to date';
    } catch (e) {
      console.error(e);
      if (manual) btn.textContent = 'Couldn’t check';
    } finally {
      if (manual) setTimeout(() => { btn.disabled = false; btn.textContent = 'Refresh'; }, 1800);
    }
  }

  $('#shell-refresh').addEventListener('click', () => refresh(true));
  $('#shell-lock').addEventListener('click', () => { forget(); location.reload(); });
  setInterval(updateSync, 60000);
  setInterval(() => { if (!document.hidden) refresh(false); }, 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
  route();

  (async () => {
    let blob;
    try { blob = await fetchBlob(); } catch (e) {
      $('#lock').hidden = false; $('#lock-msg').textContent = e.message; $('#lock-btn').disabled = true; return;
    }
    const saved = await remembered(blob);
    if (saved) {
      try { const p = await decrypt(blob, saved); key = saved; return show(p, true); } catch (_) { forget(); }
    }
    $('#lock').hidden = false;
    $('#lock-pw').focus();
    $('#lock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#lock-btn').disabled = true;
      $('#lock-msg').textContent = '';
      $('#lock-btn').textContent = 'Unlocking…';
      try {
        const k = await deriveKey($('#lock-pw').value, blob);
        const p = await decrypt(blob, k);
        key = k;
        if ($('#lock-remember').checked) {
          const raw = new Uint8Array(await crypto.subtle.exportKey('raw', k));
          try { localStorage.setItem(keySlot(blob), toB64(raw)); } catch (_) {}
        }
        $('#lock-pw').value = '';
        show(p, true);
      } catch (_) {
        $('#lock-msg').textContent = 'Wrong password.';
        $('#lock-btn').disabled = false;
        $('#lock-btn').textContent = 'Unlock';
      }
    });
  })();
})();
</script>
</body>
</html>
